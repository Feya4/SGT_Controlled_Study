# [rerun-fix] working environment for CGT (original file could not be built:
#   'sklearn' pip package is deprecated and refuses to install, torchvision was
#   unpinned (histocartography would pull a newer one that upgrades torch),
#   '-f' flags were on the same line as packages, and cython/tensorboard were missing).
name: cgt
channels:
  - defaults
dependencies:
  - python=3.7
  - pip
  - cython          # needed by pyximport to compile core/algos.pyx
  - pip:
    - --find-links https://download.pytorch.org/whl/torch_stable.html
    - torch==1.9.1+cu111
    - torchvision==0.10.1+cu111
    - dgl==0.4.3.post2
    - histocartography==0.2.0
    - scikit-learn
    - tqdm>=4.35.0
    - pandas>=0.24.2
    - matplotlib>=3.1.1
    - h5py>=2.9.0
    - seaborn>=0.9.0
    - pyyaml
    - tensorboard
    # optional, only for --logger mlflow:
    # - mlflow
